# Overrides para modos com banco local (use com docker-compose.yml + docker-compose.dev.yml + docker-compose.postgres.yml).
services:
  local-bootstrap:
    build:
      context: .
      dockerfile: back/Dockerfile
      target: dev
    container_name: abp3-local-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./back/.env
    environment:
      DATABASE_URL: postgresql://abp:abp@postgres:5432/lead_management
    command: ['node', 'back/scripts/bootstrap-local-db.mjs']
    restart: 'no'

  back:
    depends_on:
      postgres:
        condition: service_healthy
      local-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://abp:abp@postgres:5432/lead_management
