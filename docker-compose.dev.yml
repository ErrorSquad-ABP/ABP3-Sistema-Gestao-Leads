services:
  back:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./back:/app/back
      # Preserve workspace deps from the image; the bind mount above would hide back/node_modules.
      - /app/back/node_modules
      # Evita dist/ e artefatos de build como root no host ao alternar Docker ↔ native.
      - back-dev-artifacts:/app/back/dist
      # Client Prisma no volume — evita EACCES quando generated/ no host ficou root.
      - back-prisma-generated:/app/back/src/generated

  front:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./front:/app/front
      - /app/front/node_modules
      # .next no volume nomeado — não polui front/.next no host (EACCES ao rodar native depois).
      - front-next-cache:/app/front/.next

volumes:
  front-next-cache:
  back-dev-artifacts:
  back-prisma-generated:
